<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="flex items-center justify-center w-full h-[800px] ">
        <div class="w-[450px] h-[550px] border border-2 rounded-xl flex flex-col items-center m-4 p-4 bg-gradient-to-r from-sky-100 to-sky-300">
            <div class="flex gap-8">
                <i class="fas fa-brain pt-2 text-4xl text-blue-400"></i>
                <h1 id="heading" class="text-4xl font-semibold text-white">Guess the Number!!!</h1>
            </div>
            <div class=" text-center text-lg m-2">
                <p>I'm thinking of a number between 0 and 100. Wanna Guess??</p>    
            </div>
            <h2 id="attempts" class="text-lg font-bold p-2 text-white">Attempts: 0</h2>
            <div class="mt-30 flex flex-col items-center">
                <form>
                    <input id="guess" type="text" placeholder="?????" class="border border-1 text-center rounded-lg py-2 px-4">
                </form>
                <button onclick=clickMe() id="submit" class="bg-sky-500 text-white py-2 px-6 my-4  rounded-xl hover:bg-blue-400 hover:shadow-md transform duration-300">Guess</button>
            </div>
            <button onclick=resetGame() id="play" disabled class="mt-10 py-2 px-6 rounded-xl text-lg font-semibold bg-white text-blue-400 hover:bg-blue-400 hover:text-white hover:shadow-md hover:shadow-blue-500 transform duration-300 disabled:opacity-50 disabled:cursor-not-allowed">Play Again!!</button>
            
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
